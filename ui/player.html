<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Amazon Music</title>
<style>
  /* Host-provided variables (Claude's own palette) win; the fallbacks approximate Claude's UI.
     --accent is replaced at runtime with the album cover's colour, and --accent-text is the
     contrast-corrected version used for anything that has to be READ. */
  :root {
    --bg: var(--color-background-primary, #faf9f5);
    --bg2: var(--color-background-secondary, #f0eee6);
    --bg3: var(--color-background-tertiary, #e8e6dc);
    --fg: var(--color-text-primary, #141413);
    --muted: var(--color-text-secondary, #6b6a66);
    --faint: var(--color-text-tertiary, #9b9a94);
    --line: var(--color-border-primary, #e3e1d8);
    --accent: #d97757;
    --accent-text: #b4552f;
    --accent-soft: rgba(217, 119, 87, .16);
    --accent-fg: #fff;
    --danger: var(--color-text-danger, #b3261e);
    --radius: var(--border-radius-xl, 14px);
    --radius-md: var(--border-radius-lg, 10px);
    --radius-sm: var(--border-radius-md, 7px);
    --shadow: var(--shadow-sm, 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.05));
    --font: var(--font-sans, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
    --veil: rgba(250, 249, 245, .86);
    --veil2: rgba(250, 249, 245, .64);
    color-scheme: light dark;
  }
  :root[data-theme="dark"] {
    --bg: var(--color-background-primary, #262624);
    --bg2: var(--color-background-secondary, #30302e);
    --bg3: var(--color-background-tertiary, #3a3937);
    --fg: var(--color-text-primary, #f5f4ef);
    --muted: var(--color-text-secondary, #a3a19b);
    --faint: var(--color-text-tertiary, #7c7b75);
    --line: var(--color-border-primary, #3d3c38);
    --accent-text: #e89b7d;
    --accent-fg: #171614;
    --shadow: var(--shadow-sm, 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25));
    --veil: rgba(28, 28, 27, .80);
    --veil2: rgba(28, 28, 27, .54);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--color-background-primary, #262624);
      --bg2: var(--color-background-secondary, #30302e);
      --bg3: var(--color-background-tertiary, #3a3937);
      --fg: var(--color-text-primary, #f5f4ef);
      --muted: var(--color-text-secondary, #a3a19b);
      --faint: var(--color-text-tertiary, #7c7b75);
      --line: var(--color-border-primary, #3d3c38);
      --accent-text: #e89b7d;
      --accent-fg: #171614;
      --shadow: var(--shadow-sm, 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25));
      --veil: rgba(28, 28, 27, .80);
      --veil2: rgba(28, 28, 27, .54);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; color: var(--fg); font: 12.5px/1.4 var(--font); -webkit-font-smoothing: antialiased; }
  /* Never hard-clip: if the host ever sizes the frame smaller than the card, the content
     has to stay reachable rather than silently vanish. The bottom padding is room for the
     card’s drop shadow, which is painted outside its border box and was being cut off. */
  body { overflow-x: hidden; padding-bottom: 10px; scrollbar-width: none; }
  /* Reachable by wheel or keyboard if the host ever sizes the frame short, but never a
     visible scrollbar: one appearing and disappearing reflows the card and reads as flicker. */
  body::-webkit-scrollbar { width: 0; height: 0; }

  .card { position: relative; overflow: hidden; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius);
          padding: 10px 12px 9px; box-shadow: var(--shadow); max-width: 100%;
          animation: cardIn .3s cubic-bezier(.2,.7,.3,1); }
  @keyframes cardIn { from { opacity: 0; transform: translateY(6px) scale(.995); } to { opacity: 1; transform: none; } }
  .card.busy .controls button, .card.busy .like { opacity: .55; pointer-events: none; }
  /* The player moved on to another track; this card stays on its own song. */
  .card.stale .top, .card.stale .bar, .card.stale .controls { opacity: .62; }

  /* Backdrop, then a veil on top of it. The veil must be its own element: a ::before on
     .card paints under .bg, and an ::after would paint over the text. */
  .bg { position: absolute; inset: -24px; background-size: cover; background-position: center 35%;
        filter: blur(18px) saturate(1.15); opacity: 0; transition: opacity .7s ease; pointer-events: none;
        transform: scale(1.04); }
  .veil { position: absolute; inset: 0; opacity: 0; transition: opacity .7s ease; pointer-events: none;
          background: linear-gradient(100deg, var(--veil) 0%, var(--veil) 62%, var(--veil2) 100%); }
  .card.has-bg .bg { opacity: .5; animation: bgIn 1.1s ease; }
  .card.has-bg .veil { opacity: 1; }
  @keyframes bgIn { from { transform: scale(1.12); opacity: 0; } to { transform: scale(1.04); opacity: .5; } }
  .inner { position: relative; }

  .top { display: flex; gap: 11px; align-items: center; transition: opacity .3s ease; }
  .artwrap { position: relative; flex: none; }
  .art { width: 58px; height: 58px; border-radius: var(--radius-md); background: var(--bg2); object-fit: cover; display: block;
         box-shadow: 0 2px 10px rgba(0,0,0,.25); transition: opacity .35s ease, transform .35s cubic-bezier(.2,.7,.3,1); }
  .art.swap { opacity: 0; transform: scale(.94); }
  .art.empty { display: grid; place-items: center; color: var(--faint); font-size: 22px; box-shadow: none; }
  /* A soft halo in the cover's colour. */
  .artwrap::after { content: ""; position: absolute; inset: -5px; border-radius: 14px; pointer-events: none;
                    box-shadow: 0 0 18px 2px var(--accent-soft); opacity: 0; transition: opacity .6s ease; }
  .card.playing .artwrap::after { opacity: 1; }
  .eq { position: absolute; right: -4px; bottom: -4px; width: 18px; height: 18px; border-radius: 50%; background: var(--accent);
        display: none; align-items: flex-end; justify-content: center; gap: 1.5px; padding: 4px;
        box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: background .5s ease; animation: pop .3s cubic-bezier(.2,.7,.3,1); }
  @keyframes pop { from { transform: scale(0); } to { transform: none; } }
  .eq i { display: block; width: 2.5px; background: var(--accent-fg); border-radius: 1px; height: 40%; animation: eq 1s ease-in-out infinite; }
  .eq i:nth-child(2) { height: 90%; animation-delay: -.35s; } .eq i:nth-child(3) { height: 60%; animation-delay: -.7s; }
  @keyframes eq { 0%, 100% { transform: scaleY(.5); } 50% { transform: scaleY(1); } }
  .card.playing .eq { display: flex; }
  .art-spin { position: absolute; inset: 0; border-radius: var(--radius-md); background: rgba(0,0,0,.45); display: grid; place-items: center; }
  .art-spin span { width: 20px; height: 20px; border-radius: 50%; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .card.loading .eq { display: none; }

  .meta { min-width: 0; flex: 1; }
  .title { font-weight: 600; font-size: 14px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .sub .album { color: var(--faint); }
  .meta.swap .title, .meta.swap .sub, .meta.swap .tags { opacity: 0; transform: translateY(3px); }
  .meta .title, .meta .sub, .meta .tags { transition: opacity .3s ease, transform .3s ease; }
  .tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
  .tag { font-size: 9px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
         border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; line-height: 1.5; white-space: nowrap;
         animation: tagIn .28s cubic-bezier(.2,.7,.3,1) backwards; }
  @keyframes tagIn { from { opacity: 0; transform: translateY(2px) scale(.94); } to { opacity: 1; transform: none; } }
  .tag.explicit { background: var(--bg3); border-color: transparent; }
  .tag.quality { color: var(--accent-text); border-color: var(--accent-soft); background: var(--accent-soft); transition: color .5s, background .5s, border-color .5s; }
  .tag .num { opacity: .8; font-weight: 500; letter-spacing: .01em; margin-left: 3px; text-transform: none; font-size: 9.5px; }

  button { border: 0; background: transparent; color: var(--fg); border-radius: 999px; width: 28px; height: 28px; padding: 0; cursor: pointer;
           display: inline-grid; place-items: center; position: relative; overflow: hidden;
           transition: background .14s, color .3s, transform .1s cubic-bezier(.2,.7,.3,1), opacity .2s; }
  button:hover { background: var(--bg2); }
  button:active { transform: scale(.9); }
  button:disabled { opacity: .3; cursor: default; background: transparent; }
  button:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 1px; }
  button svg { width: 15px; height: 15px; fill: currentColor; }
  button.on { color: var(--accent-text); }
  button.on::after { content: ""; position: absolute; bottom: 2px; width: 3px; height: 3px; border-radius: 50%; background: var(--accent-text); }
  .like { flex: none; margin-right: -4px; }
  .like.on { color: var(--accent-text); }
  .like.on::after { display: none; }
  .like.bump { animation: bump .4s cubic-bezier(.2,.7,.3,1); }
  @keyframes bump { 30% { transform: scale(1.28); } 60% { transform: scale(.94); } }

  .bar { display: flex; align-items: center; gap: 8px; margin-top: 8px; color: var(--faint); font-size: 10.5px;
         font-variant-numeric: tabular-nums; transition: opacity .3s ease; }
  .track { position: relative; flex: 1; height: 3px; border-radius: 2px; background: var(--bg3); overflow: hidden; }
  /* scaleX is driven by requestAnimationFrame; a CSS transition here would fight it. */
  .track > div { position: absolute; inset: 0; transform-origin: left center; transform: scaleX(0); background: var(--accent);
                 border-radius: 2px; transition: background .5s ease; }
  .card.playing .track::after { content: ""; position: absolute; inset: 0; border-radius: 2px; pointer-events: none;
    background: linear-gradient(90deg, transparent, var(--accent-soft), transparent); animation: sheen 2.6s ease-in-out infinite; }
  @keyframes sheen { 0% { transform: translateX(-100%); } 60%, 100% { transform: translateX(100%); } }

  .row2 { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
  .controls { display: flex; align-items: center; justify-content: center; gap: 2px; flex: 1; min-width: 0; }
  .controls .primary { background: var(--fg); color: var(--bg); width: 34px; height: 34px; margin: 0 4px; }
  .controls .primary:hover { background: var(--fg); filter: brightness(1.14); }
  .controls .primary svg { width: 15px; height: 15px; }
  .rep1 { position: absolute; font-size: 7.5px; font-weight: 700; right: 4px; top: 4px; line-height: 1; }

  /* Volume: a slim rail that fills in the cover colour, with a thumb that grows on hover. */
  .vol { display: flex; align-items: center; gap: 6px; color: var(--muted); width: 116px; flex: none; }
  .vol button { width: 24px; height: 24px; flex: none; }
  /* Until the server has read the real volume there is nothing honest to show, so the
     slider is inert rather than parked at a value nobody set. */
  .vol input:disabled { opacity: .4; cursor: default; }
  .vol button svg { width: 14px; height: 14px; }
  .vol input { -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; height: 14px; margin: 0; background: transparent; cursor: pointer; }
  .vol input::-webkit-slider-runnable-track { height: 4px; border-radius: 3px;
    background: linear-gradient(90deg, var(--accent) 0 var(--fill, 100%), var(--bg3) var(--fill, 100%) 100%); transition: background .12s linear; }
  .vol input::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 10px; height: 10px; border-radius: 50%;
    background: var(--fg); margin-top: -3px; box-shadow: 0 1px 3px rgba(0,0,0,.35);
    transition: transform .14s cubic-bezier(.2,.7,.3,1), background .3s; }
  .vol:hover input::-webkit-slider-thumb, .vol input:focus-visible::-webkit-slider-thumb { transform: scale(1.35); background: var(--accent); }
  .vol input:focus-visible { outline: none; }
  .vol .pct { width: 3ch; text-align: right; font-size: 10px; color: var(--faint); font-variant-numeric: tabular-nums;
              opacity: 0; transition: opacity .2s; }
  .vol:hover .pct, .vol input:focus-visible ~ .pct { opacity: 1; }
  .right { display: flex; align-items: center; gap: 2px; flex: none; }
  .right button { width: 26px; height: 26px; }
  .right button svg { width: 14px; height: 14px; }

  .panel { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 6px; animation: panelIn .24s cubic-bezier(.2,.7,.3,1); }
  @keyframes panelIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: none; } }
  .phead { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--faint);
           font-size: 10px; text-transform: uppercase; letter-spacing: .07em; padding: 0 4px 4px; }
  .phead button { width: auto; height: 20px; padding: 0 8px; font: inherit; font-size: 9.5px; letter-spacing: .06em;
                  text-transform: uppercase; color: var(--accent-text); border: 1px solid var(--accent-soft); background: var(--accent-soft); }
  .rows { display: grid; gap: 1px; max-height: 190px; overflow-y: auto; scrollbar-width: thin; }
  .rows .none { color: var(--faint); font-style: italic; padding: 4px 6px; }
  .row { display: flex; gap: 9px; align-items: center; padding: 4px 6px 4px 4px; border-radius: var(--radius-sm);
         border: 1px solid transparent; transition: background .14s, border-color .14s, transform .14s;
         animation: rowIn .26s cubic-bezier(.2,.7,.3,1) backwards; }
  @keyframes rowIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .row.click { cursor: pointer; }
  .row.click:hover { background: var(--bg2); transform: translateX(2px); }
  .row img { width: 30px; height: 30px; border-radius: 5px; object-fit: cover; background: var(--bg2); flex: none; }
  .row .rm { min-width: 0; flex: 1; }
  .row .t { font-weight: 500; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .s { color: var(--muted); font-size: 11px; overflow: hidden; display: flex; gap: 5px; align-items: center; }
  .row .s .stext { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .n { color: var(--faint); font-size: 10px; width: 1.6em; text-align: right; flex: none; font-variant-numeric: tabular-nums; }
  .row .go { width: 24px; height: 24px; color: var(--muted); flex: none; display: grid; place-items: center; }
  .row .go svg { width: 12px; height: 12px; fill: currentColor; }
  .row.loading .go svg { animation: spin .8s linear infinite; }

  .lyrics { max-height: 168px; overflow-y: auto; padding: 2px 4px; scrollbar-width: thin; overscroll-behavior: contain; }
  .lyrics div { color: var(--faint); font-size: 12.5px; line-height: 1.45; padding: 2px 0;
                transition: color .4s ease, opacity .4s ease, transform .4s cubic-bezier(.2,.7,.3,1); }
  .lyrics div.past { color: var(--muted); opacity: .7; }
  .lyrics div.now { color: var(--fg); font-weight: 600; font-size: 13px; transform: translateX(3px); }
  .lyrics .none { color: var(--faint); font-style: italic; }

  .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 7px;
          padding-top: 6px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px;
          animation: panelIn .24s cubic-bezier(.2,.7,.3,1); }
  .foot .ft { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .foot button { width: auto; height: 22px; padding: 0 9px; font: inherit; font-size: 10px; text-transform: uppercase;
                 letter-spacing: .06em; color: var(--accent-text); border: 1px solid var(--accent-soft); background: var(--accent-soft); }

  /* Card skeleton: shown until the first state arrives, and while switching tracks, so the
     card never flashes "Nothing is playing" or an empty frame. */
  .skel { animation: panelIn .2s ease; }
  .skel-top { display: flex; gap: 11px; align-items: center; }
  .skel-meta { flex: 1; min-width: 0; }
  .sk { background: linear-gradient(90deg, var(--bg2) 25%, var(--bg3) 50%, var(--bg2) 75%); background-size: 220% 100%;
        border-radius: 5px; animation: shimmer 1.3s linear infinite; }
  @keyframes shimmer { from { background-position: 130% 0; } to { background-position: -30% 0; } }
  .sk-art { width: 58px; height: 58px; border-radius: var(--radius-md); flex: none; }
  .sk-title { height: 12px; width: 46%; margin-bottom: 7px; }
  .sk-sub { height: 10px; width: 30%; margin-bottom: 8px; }
  .sk-tags { height: 12px; width: 22%; }
  .sk-bar { height: 4px; margin-top: 12px; border-radius: 2px; }
  .sk-controls { height: 26px; width: 44%; margin: 14px auto 4px; border-radius: 999px; }

  .status { margin-top: 6px; color: var(--muted); font-size: 11px; }
  .status:empty { display: none; }
  .status.err { color: var(--danger); }
  .notice { display: flex; gap: 10px; align-items: center; justify-content: space-between; font-size: 12.5px; color: var(--muted); }
  .notice button { width: auto; height: 26px; padding: 0 12px; border: 1px solid var(--line); font-size: 12px; color: var(--fg); }
  [hidden] { display: none !important; }
  @media (max-width: 470px) { .vol { width: 30px; } .vol input, .vol .pct { display: none; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    .eq i { animation: none; }
  }
</style>
</head>
<body>
<div id="card" class="card">
  <div id="bg" class="bg" aria-hidden="true"></div>
  <div class="veil" aria-hidden="true"></div>
  <div class="inner">
    <div id="skeleton" class="skel">
      <div class="skel-top">
        <div class="sk sk-art"></div>
        <div class="skel-meta"><div class="sk sk-title"></div><div class="sk sk-sub"></div><div class="sk sk-tags"></div></div>
      </div>
      <div class="sk sk-bar"></div>
      <div class="sk sk-controls"></div>
    </div>
    <div id="empty" class="notice" hidden><span id="emptyText">Nothing is playing.</span><button id="emptyBtn" hidden></button></div>
    <div id="main" hidden>
      <div class="top">
        <div class="artwrap">
          <img id="art" class="art" alt="" hidden />
          <div id="artEmpty" class="art empty">♪</div>
          <div id="artSpin" class="art-spin" aria-hidden="true" hidden><span></span></div>
          <div class="eq" aria-hidden="true"><i></i><i></i><i></i></div>
        </div>
        <div id="meta" class="meta">
          <div id="title" class="title"></div>
          <div class="sub"><span id="artist"></span><span id="album" class="album"></span></div>
          <div id="tags" class="tags"></div>
        </div>
        <button id="like" class="like" title="Like" aria-label="Like"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.6-9.3-8.6C.9 9.2 2.4 5.5 5.8 5c1.9-.3 3.6.6 4.6 2 1-1.4 2.7-2.3 4.6-2 3.4.5 4.9 4.2 3.1 7.4C19 16.4 12 21 12 21z"/></svg></button>
      </div>
      <div class="bar"><span id="pos">0:00</span><div class="track"><div id="barFill"></div></div><span id="dur">0:00</span></div>
      <div class="row2">
        <div class="vol">
          <button id="mute" title="Mute" aria-label="Mute"><svg id="volIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg><svg id="muteIcon" viewBox="0 0 24 24" hidden><path d="M3 9v6h4l5 5V4L7 9H3zm13.6 3 2.6-2.6-1.4-1.4-2.6 2.6-2.6-2.6-1.4 1.4 2.6 2.6-2.6 2.6 1.4 1.4 2.6-2.6 2.6 2.6 1.4-1.4z"/></svg></button>
          <input id="vol" type="range" min="0" max="100" value="100" aria-label="Volume" />
          <span id="volPct" class="pct">100</span>
        </div>
        <div class="controls">
          <button id="shuffle" title="Shuffle" aria-label="Shuffle"><svg viewBox="0 0 24 24"><path d="M17 4l4 4-4 4V9h-2.2l-2.4 3 2.4 3H17v-3l4 4-4 4v-3h-3.2l-3.1-3.9L7.6 19H3v-2h3.6l3.1-3.9L6.6 9H3V7h4.6l3.1 3.9L13.8 7H17V4z"/></svg></button>
          <button id="prev" title="Previous" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
          <button id="play" class="primary" title="Play/pause" aria-label="Play or pause"><svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><svg id="pauseIcon" viewBox="0 0 24 24" hidden><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg></button>
          <button id="next" title="Next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
          <button id="repeat" title="Repeat" aria-label="Repeat"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg><span id="rep1" class="rep1" hidden>1</span></button>
        </div>
        <div class="right">
          <button id="autoplayBtn" title="Autoplay" aria-label="Autoplay" hidden><svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg></button>
          <button id="queueBtn" title="Up next" aria-label="Up next" hidden><svg viewBox="0 0 24 24"><path d="M3 6h12v2H3zm0 4h12v2H3zm0 4h8v2H3zm12 .2V9l6 3.6z"/></svg></button>
